<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Administrasi Guru - SD Negeri 1 Gerduren</title>
<!--
  =====================================================================
  TEACHER PLANNER SD 2026 - MULTI-KELAS (KELAS 1-6)  (SINGLE FILE APPLICATION)
  ---------------------------------------------------------------------
  - 100% offline, tanpa server, tanpa build process.
  - Semua data disimpan di localStorage perangkat (tidak terkirim ke
    mana pun). Buka file ini langsung dari browser di Xiaomi Pad 7 Pro
    (atau perangkat lain) untuk mulai memakainya.
  - Pemilih "Kelas Aktif" di bagian atas aplikasi menentukan data siswa,
    kehadiran, nilai, jurnal, jadwal, dsb. yang ditampilkan. Data setiap
    kelas disimpan TERPISAH (kunci localStorage berbeda per kelas) agar
    tidak pernah tercampur. Data guru/tendik, profil sekolah, dan
    kalender pendidikan bersifat sekolah (dipakai bersama semua kelas).
  - Data Kelas 1 (siswa, guru, tendik) diambil dari dokumen resmi yang
    diunggah (Dapodik / Data Siswa 2026-2027 / KOP Surat SDN 1
    Gerduren). Kelas 2-6 dimulai KOSONG (tidak ada data karangan) dan
    siap diisi Bapak/Ibu Guru lewat menu masing-masing.
  - Aplikasi versi sebelumnya (satu kelas) otomatis dimigrasikan satu
    kali menjadi data "Kelas 1" saat file ini pertama kali dibuka --
    tidak ada data lama yang hilang.
  - CATATAN JUJUR TENTANG BATASAN (baca menu "Tentang Aplikasi" di
    Pengaturan): ekspor "Word" & "Excel" dibuat memakai teknik HTML
    yang dibaca native oleh Ms Word / Ms Excel (tanpa pustaka
    eksternal, tetap offline). Ekspor PDF memakai print-to-PDF bawaan
    browser. Konversi tulisan tangan ke teks (OCR) TIDAK tersedia
    offline murni HTML/JS - lihat penjelasan pada menu Tulisan Tangan.
  =====================================================================
-->
  <link rel="stylesheet" href="assets/css/app.css">
<!--
  Skrip di bawah ini (Supabase JS + konfigurasi supabase.js) HANYA
  dipakai oleh fitur opsional "Cloud Storage (Backup & Restore)" di
  menu Sistem. Fitur ini BUKAN bagian dari mode offline utama aplikasi:
    - Memerlukan koneksi internet saat dipakai.
    - Memerlukan project Supabase milik sendiri (lihat PANDUAN_SUPABASE.md
      dan isi SUPABASE_URL/SUPABASE_ANON_KEY pada file supabase.js).
    - Jika skrip ini gagal dimuat (tidak ada internet / file supabase.js
      belum dikonfigurasi), seluruh fitur lain di aplikasi tetap berjalan
      normal 100% offline seperti biasa.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase.js"></script>
</head>
<body>

<!-- =============================== LOCK SCREEN =============================== -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo" style="background:#fff;padding:6px;">
      <img id="lockLogoImg" alt="Logo SD Negeri 1 Gerduren" style="width:52px;height:52px;object-fit:contain;display:block;">
    </div>
    <h2 id="lockTitle" style="font-size:17px;margin-bottom:2px;">Administrasi Guru</h2>
    <div class="muted" style="font-size:12.5px;color:#e4e9ff;margin-bottom:6px;">Kelas 1 &middot; SDN 1 Gerduren</div>
    <div id="pinArea">
      <div class="pin-dots" id="pinDots"></div>
      <div class="lock-msg" id="lockMsg">Masukkan PIN untuk membuka aplikasi</div>
      <div class="pin-pad" id="pinPad"></div>
    </div>
    <div id="noPinArea" style="display:none;">
      <p style="font-size:13px;color:#eef1ff;margin:10px 0 16px;">Aplikasi belum dikunci PIN.</p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="unlockApp()">Buka Aplikasi</button>
    </div>
  </div>
</div>

<!-- =============================== APP SHELL =============================== -->
<div id="app">
  <div class="overlay-mask" id="sidebarMask" onclick="toggleSidebar(false)"></div>

  <aside class="sidebar" id="sidebar"><!-- filled by JS: buildSidebar() --></aside>

  <div class="main">
    <div class="topbar no-print">
      <button class="iconbtn" id="menuToggle" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="titlewrap"><div class="crumb" id="crumb">Utama</div><h2 id="pageTitle">Dashboard</h2></div>
      <div class="grow"></div>
      <select id="classSwitcher" class="class-switcher" title="Pilih Kelas Aktif" onchange="switchActiveClass(this.value)"></select>
      <button class="iconbtn" onclick="toggleTheme()" title="Mode gelap/terang">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="iconbtn" onclick="lockNow()" title="Kunci aplikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </button>
      <span class="topbar-credit">By Edukreativa@Anggi</span>
    </div>
    <div class="content" id="pageContent"><!-- filled by JS router --></div>
  </div>
</div>

<div id="toastHost"></div>
<div id="printArea"></div>

  <script src="assets/js/05-logo.js"></script>
  <script src="assets/js/10-data.js"></script>
  <script src="assets/js/20-storage.js"></script>
  <script src="assets/js/30-core.js"></script>
  <script src="assets/js/40-pages-a.js"></script>
  <script src="assets/js/40-pages-b.js"></script>
  <script src="assets/js/50-pages2.js"></script>
  <script src="assets/js/60-cloud.js"></script>
  <script src="assets/js/70-shell.js"></script>
  <script src="assets/js/80-ai.js"></script>
  <script>try{ if(typeof LOGO_SEKOLAH!=="undefined"){ var li=document.getElementById("lockLogoImg"); if(li) li.src=LOGO_SEKOLAH; } }catch(e){}</script>
  <script src="assets/js/90-boot.js"></script>
</body>
</html>
