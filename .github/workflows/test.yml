name: AdminGuru checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Core browser regressions
        run: node tests/browser.cjs
      - name: Library browser regressions
        if: ${{ !cancelled() }}
        run: node tests/library-browser.cjs
      - name: Word browser regressions
        if: ${{ !cancelled() }}
        run: node tests/word-browser.cjs
      - name: Program document regressions
        if: ${{ !cancelled() }}
        run: npm run test:program
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-verification
          path: test-results/
          if-no-files-found: ignore
